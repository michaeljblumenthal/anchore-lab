[project]
name = "sbom-mcp-server"
version = "0.1.0"
description = "MCP server orchestrating Syft, Grype and Grant against a target path"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sbom-mcp-server = "sbom_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sbom_mcp_server*"]
