# Deliberate breakage per the plan: a pod that CrashLoopBackOffs from a
# missing/malformed secret reference. Applied and diagnosed manually, not
# part of bootstrap.sh's normal path — kept here as a reproducible example
# for the write-up, not as a permanent fixture.
apiVersion: v1
kind: Pod
metadata:
  name: broken-secret-demo
  namespace: anchore-lab
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"password is $DB_PASSWORD\" && sleep 3600"]
      envFrom:
        - secretRef:
            name: db-credentials  # never created — deliberate
