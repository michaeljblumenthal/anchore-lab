# Tells containerd inside every k3d node to trust the in-cluster Zot
# registry over plain HTTP, and rewrites pod-side image pulls (which use the
# same "zot.lab.localhost:8080" name as host-side pushes, for a consistent
# image reference across manifests — see push-to-registry.sh /
# mirror-to-registry.sh) to Zot's Kubernetes Service ClusterIP.
#
# Why a bare IP and not the Service DNS name
# (zot.anchore-lab-system.svc.cluster.local): tried that first. containerd's
# image-pull path runs at the node/host network level, outside the pod
# network where CoreDNS is reachable — the node's own resolv.conf points at
# Docker's embedded DNS (127.0.0.11), which has never heard of the
# cluster's DNS domain, so the lookup fails with NXDOMAIN/"Try again". This
# is a documented, known constraint (k3d's own registries guide addresses
# it by running the registry as a separate k3d-managed Docker container
# instead of a Kubernetes Service) — not a misconfiguration. Given the
# plan's requirement that the registry be self-hosted in-cluster (a real
# Kubernetes Deployment, not a sidecar Docker container next to k3d), the
# ClusterIP is the pragmatic fix: confirmed reachable from every node
# (`wget http://<clusterIP>:5000/v2/` succeeds from inside a node
# container) because node-to-pod-network routing works even though DNS
# doesn't.
#
# Why this doesn't need a chicken-and-egg workaround: Zot's Service is
# pinned to a fixed ClusterIP (10.43.0.53, in k3s's default 10.43.0.0/16
# service CIDR) via service.clusterIP in
# phase3-inventory/helm-values/zot.yaml, so this file can reference it
# before Zot is ever installed — the address is a decision this repo makes,
# not something read back from a running cluster.
#
# Passed to k3d at cluster-create time via --registry-config, which mounts
# this file at /etc/rancher/k3s/registries.yaml on every node before k3s
# starts (k3d does not support mutating this in a running cluster — it must
# be present at creation).
mirrors:
  "zot.lab.localhost:8080":
    endpoint:
      - "http://10.43.0.53:5000"
configs:
  "10.43.0.53:5000":
    tls:
      insecure_skip_verify: true
